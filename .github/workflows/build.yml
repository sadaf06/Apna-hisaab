name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platforms;android-34" "build-tools;34.0.0" || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list | grep -E "platforms;android|build-tools" | head -20 || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set - add in Settings > Secrets > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          ls -lh "$GITHUB_WORKSPACE/my-upload-key.jks"
          # verify keystore (masked)
          echo "Keystore decoded successfully"

      - name: Create local.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            printf "STORE_PASSWORD=%s\n" "$STORE_PASSWORD"
            printf "KEY_PASSWORD=%s\n" "$KEY_PASSWORD"
            printf "KEY_ALIAS=%s\n" "$KEY_ALIAS"
            printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY"
          } > local.properties
          echo "local.properties created (secrets masked)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u "$GITHUB_WORKSPACE/my-upload-key.jks" local.properties 2>/dev/null || rm -f "$GITHUB_WORKSPACE/my-upload-key.jks" local.properties
          echo "Secrets cleaned"
