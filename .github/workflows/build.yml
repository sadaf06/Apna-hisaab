name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platforms;android-34" "build-tools;34.0.0" || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list | grep -E "platforms;android|build-tools" | head -20 || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set - add in Settings > Secrets > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          ls -lh "$GITHUB_WORKSPACE/my-upload-key.jks"
          # verify keystore (masked)
          echo "Keystore decoded successfully"

      - name: Create local.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Validate all secrets are present (length only, never echo values)
          echo "Secret lengths (0 = missing):"
          echo "STORE_PASSWORD len: ${#STORE_PASSWORD}"
          echo "KEY_PASSWORD len: ${#KEY_PASSWORD}"
          echo "KEY_ALIAS len: ${#KEY_ALIAS}"
          echo "GEMINI_API_KEY len: ${#GEMINI_API_KEY}"
          if [ -z "$STORE_PASSWORD" ]; then echo "::error::STORE_PASSWORD secret missing"; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "::error::KEY_PASSWORD secret missing"; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "::error::KEY_ALIAS secret missing (should be apnahisaab)"; exit 1; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret missing - add in Settings > Secrets > Actions with your AI Studio key"; exit 1; fi
          if [ "$GEMINI_API_KEY" = "MY_GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY is still placeholder MY_GEMINI_API_KEY - set real key"; exit 1; fi
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            printf "STORE_PASSWORD=%s\n" "$STORE_PASSWORD"
            printf "KEY_PASSWORD=%s\n" "$KEY_PASSWORD"
            printf "KEY_ALIAS=%s\n" "$KEY_ALIAS"
            printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY"
          } > local.properties
          printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY" > .env
          cp .env app/.env
          echo ".env len: $(wc -c < .env) bytes / app/.env len: $(wc -c < app/.env) bytes"
          ls -lh .env app/.env local.properties
          echo "local.properties + .env (root+app) created (secrets masked)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enforce Palette token gate
        run: |
          if grep -R "Color(0x" --include="*.kt" app/src | grep -v "Palette.kt" | grep -q .; then echo "::error::Raw Color(0x) outside Palette.kt"; grep -R "Color(0x" --include="*.kt" app/src | grep -v "Palette.kt"; exit 1; fi; echo "Palette gate passed"

      - name: Enforce Typography gate (warn-only for incrementally fixing 22 inline fontSize)
        run: |
          count=$(grep -R "fontSize =" --include="*.kt" app/src/main/java/com/example/ui/screens 2>/dev/null | wc -l); echo "Inline fontSize hits in screens: $count"; if [ "$count" -gt 0 ]; then echo "::warning::22 inline fontSize will be migrated to Type.kt tokens in 02-02"; grep -R "fontSize =" --include="*.kt" app/src/main/java/com/example/ui/screens | head -5; fi; echo "Typography gate checked"

      - name: Enforce Spacing gate (warn-only until Wave 2-03 completes)
        run: |
          count=$(grep -R "140\.dp\|180\.dp" --include="*.kt" app/src 2>/dev/null | wc -l); echo "Raw 140/180dp hits: $count"; if [ "$count" -gt 0 ]; then echo "::warning::Raw 140/180dp will be migrated to Dimens.navBarClearance in 02-03"; grep -R "140\.dp\|180\.dp" --include="*.kt" app/src | head -5; fi; echo "Spacing gate checked"

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u "$GITHUB_WORKSPACE/my-upload-key.jks" local.properties .env app/.env 2>/dev/null || rm -f "$GITHUB_WORKSPACE/my-upload-key.jks" local.properties .env app/.env
          echo "Secrets cleaned"
